board: MKS-DLC32 V2.1
name: XZACt_MiniLathe
meta: Maijker mini lathe config, confirmed against unchanged OG wiring for deployment.

kinematics:
  Cartesian:

# Pendant UART.
# Connect txd_pin gpio.18 to pendant RX, and rxd_pin gpio.23 to pendant TX.
uart1:
  txd_pin: gpio.18
  rxd_pin: gpio.23
  rts_pin: NO_PIN
  cts_pin: NO_PIN
  baud: 1000000
  mode: 8N1

uart_channel1:
  report_interval_ms: 75
  uart_num: 1

stepping:
  engine: I2S_STATIC
  # Hold the axes after motion so short jogs do not chatter the driver enables.
  idle_ms: 3000
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

axes:
  shared_stepper_disable_pin: i2so.0
  x:
    # 200-step motor * 16 microsteps / 5 mm SFU1605 lead.
    steps_per_mm: 640
    # Conservative jeweler-lathe commissioning profile.
    max_rate_mm_per_min: 600
    acceleration_mm_per_sec2: 25
    max_travel_mm: 60
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: true
      mpos_mm: 60.000
      feed_mm_per_min: 250
      seek_mm_per_min: 400
      settle_ms: 500
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_neg_pin: gpio.36:low
      hard_limits: true
      pulloff_mm: 2
      stepstick:
        step_pin: i2so.1
        direction_pin: i2so.2

  z:
    # 200-step motor * 16 microsteps / 5 mm SFU1605 lead.
    steps_per_mm: 640
    # Conservative jeweler-lathe commissioning profile.
    max_rate_mm_per_min: 600
    acceleration_mm_per_sec2: 25
    max_travel_mm: 90
    soft_limits: true
    homing:
      cycle: 2
      positive_direction: true
      mpos_mm: 90.000
      feed_mm_per_min: 250
      seek_mm_per_min: 400
      settle_ms: 500
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_neg_pin: gpio.34:low
      hard_limits: true
      pulloff_mm: 2
      stepstick:
        step_pin: i2so.3
        direction_pin: i2so.4

  # Direct-drive NEMA23 commanded spindle axis: 200 steps * 8 microsteps / 360 degrees.
  # This is not spindle phase feedback; the lathe encoder below must be a real spindle encoder.
  c:
    steps_per_mm: 4.444444
    max_rate_mm_per_min: 243000
    acceleration_mm_per_sec2: 9000
    max_travel_mm: 100000
    soft_limits: false
    motor0:
      limit_all_pin: NO_PIN
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 0.000
      stepstick:
        step_pin: i2so.5
        direction_pin: i2so.6

i2so:
  bck_pin: gpio.16
  data_pin: gpio.21
  ws_pin: gpio.17
  fifo_threshold: 40
  fifo_reload: 23

spi:
  miso_pin: gpio.12
  mosi_pin: gpio.13
  sck_pin: gpio.14

sdcard:
  cs_pin: gpio.15
  card_detect_pin: NO_PIN

control:
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN
  macro0_pin: NO_PIN
  macro1_pin: NO_PIN
  macro2_pin: NO_PIN
  macro3_pin: NO_PIN
  fault_pin: NO_PIN
  estop_pin: NO_PIN
  homing_button_pin: NO_PIN

macros:
  startup_line0:
  startup_line1:
  macro0:
  macro1:
  macro2:
  macro3:

coolant:
  flood_pin: NO_PIN
  mist_pin: NO_PIN
  delay_ms: 0

probe:
  pin: gpio.22
  check_mode_start: true

maijker_5_station_turret:
  station_count: 5
  step_pin: i2so.7
  direction_pin: gpio.5
  forward_direction: true
  steps_per_station: 320
  step_rate_hz: 400
  pulse_us: 10
  dir_setup_ms: 10
  overshoot_steps: 32
  lock_backoff_steps: 32
  lock_settle_ms: 250
  require_confirmed_tool: true
  current_tool: 0
  sensor_pin: NO_PIN
  sensor_tool: 1
  sensor_debounce_ms: 25
  home_timeout_steps: 2000

CStepper:
  # The direct-drive NEMA23 on the C/Y step and direction outputs is both the
  # indexed C axis and the open-loop spindle. The 1600 pulses/rev scale comes
  # from axes.c; continuous spindle speed is configured independently.
  axis: 5
  cw_positive: true
  minimum_rpm: 50.0
  maximum_rpm: 675.0
  acceleration_rpm_per_sec: 1500.0
  deceleration_rpm_per_sec: 100.0
  operator_watchdog_ms: 12000
  tool_num: 0
  off_on_alarm: true
  atc: maijker_5_station_turret

user_outputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN

start:
  must_home: true

status_outputs:
  report_interval_ms: 500
  idle_pin: NO_PIN
  run_pin: NO_PIN
  hold_pin: NO_PIN
  alarm_pin: NO_PIN
  door_pin: NO_PIN

lathe:
  enable: true
  enable_css: true
  enable_feed_per_rev: true
  enable_threading: false
  min_css_diameter_mm: 1.000
  max_css_rpm: 675.000
  x_axis: 0
  z_axis: 2
  # C positioning and the CStepper spindle share one step/dir driver. Firmware
  # rejects simultaneous ownership and synchronizes mode transitions.
  shared_chuck: true
  c_axis: 5
  feedback_stale_ms: 250
  encoder_enable: false
  # No spindle/C-axis encoder is currently installed. Keep feedback and
  # threading disabled until encoder hardware is installed and commissioned.
  encoder_pulse_pin: NO_PIN
  encoder_index_pin: NO_PIN
  encoder_pulses_per_rev: 1
