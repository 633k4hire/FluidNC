name: Maijker Lathe Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test maijker_wifi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.9"
          cache: pip

      - name: Install pinned build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify packaged Maijker configuration
        run: python tools/verify_maijker_littlefs_config.py

      - name: Run native tests
        run: pio test -e tests

      - name: Build Maijker application
        run: pio run -e maijker_wifi

      - name: Build Maijker LittleFS image
        run: pio run -e maijker_wifi -t buildfs

      - name: Generate address map
        run: |
          python tools/stack_trace_decoder/generate_addrinfo.py \
            .pio/build/maijker_wifi/firmware.elf \
            -o .pio/build/maijker_wifi/firmware.addrinfo \
            --build maijker_wifi \
            --verbose

      - name: Write checksums
        run: |
          cd .pio/build/maijker_wifi
          sha256sum \
            firmware.bin \
            firmware.elf \
            firmware.addrinfo \
            partitions.bin \
            bootloader.bin \
            littlefs.bin > SHA256SUMS

      - name: Upload immutable firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maijker_wifi-${{ github.sha }}
          path: |
            .pio/build/maijker_wifi/firmware.bin
            .pio/build/maijker_wifi/firmware.elf
            .pio/build/maijker_wifi/firmware.addrinfo
            .pio/build/maijker_wifi/partitions.bin
            .pio/build/maijker_wifi/bootloader.bin
            .pio/build/maijker_wifi/littlefs.bin
            .pio/build/maijker_wifi/SHA256SUMS
          if-no-files-found: error
